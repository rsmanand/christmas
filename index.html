<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  text-align: center;
  font-family: Arial, sans-serif;
  color: white;
  background: black;
  overflow: hidden;
}

.firework {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url("https://media.giphy.com/media/26BRrSvJUa0crqw4E/giphy.gif");
  background-size: cover;
  opacity: 0.8;
  z-index: -1;
}

.message {
  margin-top: 40%;
  padding: 20px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #25D366;
  color: white;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="firework"></div>

<!-- Background Music -->
<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-christmas.mp3" type="audio/mpeg">
</audio>

<div class="message" id="msg"></div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "My Friend";

document.getElementById("msg").innerHTML = `
<h1>🎄 Dear ${name} 🎄</h1>
<h2>Muruganandam R S wishes you a Merry Christmas 🎅</h2>

<button onclick="shareWhatsApp()">Share on WhatsApp</button>
`;

function shareWhatsApp() {
  const text = `🎄 Dear ${name} 🎄\nMuruganandam R S wishes you a Merry Christmas 🎅\n\nClick below 👇`;
  const url = window.location.href;
  window.location.href =
    "https://wa.me/?text=" + encodeURIComponent(text + "\n" + url);
}
</script>

</body>
</html>
