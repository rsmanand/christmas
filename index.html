<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: black;
  overflow: hidden;
}

/* Christmas background */
.background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url("https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif");
  background-size: cover;
  background-position: center;
  z-index: -3;
}

/* Dark overlay for readability */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  z-index: -2;
}

/* Snowflakes */
.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 1em;
  user-select: none;
  animation: fall linear infinite;
}

@keyframes fall {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(110vh); opacity: 0; }
}

/* Message box */
.message {
  margin-top: 35vh;
  padding: 20px;
}

button {
  margin-top: 20px;
  padding: 12px 22px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #25D366;
  color: white;
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<!-- Church Bell / Choir Music -->
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2021/12/21/audio_09d18a4b45.mp3?filename=christmas-choir-126258.mp3" type="audio/mpeg">
</audio>

<div class="message" id="msg"></div>

<script>
/* Get name from URL */
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Dear Friend";

/* Display message */
document.getElementById("msg").innerHTML = `
  <h1>🎄 ${name} 🎄</h1>
  <h2>Murugu wishes you a Merry Christmas</h2>
  <button onclick="shareWhatsApp()">Share on WhatsApp</button>
`;

/* WhatsApp Share */
function shareWhatsApp() {
  const text = `🎄 ${name} 🎄\nMurugu wishes you a Merry Christmas\n\nClick below 👇`;
  const url = window.location.href;
  window.location.href =
    "https://wa.me/?text=" + encodeURIComponent(text + "\n" + url);
}

/* Create snowflakes */
for (let i = 0; i < 40; i++) {
  let snow = document.createElement("div");
  snow.className = "snowflake";
  snow.innerHTML = "❄";
  snow.style.left = Math.random() * 100 + "vw";
  snow.style.fontSize = (Math.random() * 10 + 10) + "px";
  snow.style.animationDuration = (Math.random() * 5 + 5) + "s";
  document.body.appendChild(snow);
}
</script>

</body>
</html>
